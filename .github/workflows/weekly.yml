name: Weekly new articles

on:
  schedule:
    - cron: "30 4 * * 1"   # Mondays 10:00 IST
  workflow_dispatch:

permissions:
  contents: write
  models: read
  actions: write

jobs:
  articles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Write new articles with GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python weekly_articles.py
      - name: Verify the site still builds
        run: python build.py
      - name: Commit and trigger deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet generated.json; then echo "No new articles"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated.json
          git commit -m "Add weekly articles"
          git push
          gh workflow run deploy.yml
