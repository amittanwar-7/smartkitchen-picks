name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 0 * * *"   # daily 06:00 IST: refresh product prices/images
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch products from Flipkart Affiliate API
        env:
          FK_AFFILIATE_ID: amittanwa1
          FK_AFFILIATE_TOKEN: ${{ secrets.FK_AFFILIATE_TOKEN }}
        run: python fetch_products.py
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
